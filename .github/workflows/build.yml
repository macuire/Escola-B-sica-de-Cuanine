name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Funciona de duas formas: ficheiros soltos no repositório (gradlew na raiz)
      # ou um ficheiro .zip enviado para a raiz do repositório.
      - name: Localizar o projecto
        id: locate
        run: |
          set -e
          if [ -f gradlew ]; then
            DIR="."
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
            if [ -z "$ZIP" ]; then
              echo "Nao encontrei gradlew nem nenhum ficheiro .zip na raiz do repositorio."
              exit 1
            fi
            echo "A descompactar $ZIP"
            mkdir -p _projecto
            unzip -q -o "$ZIP" -d _projecto
            G=$(find _projecto -maxdepth 3 -name gradlew | head -n1)
            if [ -z "$G" ]; then
              echo "gradlew nao encontrado dentro do ZIP."
              exit 1
            fi
            DIR=$(dirname "$G")
          fi
          echo "Projecto em: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Permissao de execucao do gradlew
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x gradlew

      - name: Compilar APK de debug
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EB-Cuanine-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Os testes correm depois do APK; se falharem, o APK continua disponivel.
      - name: Testes unitarios
        id: tests
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Guardar relatorios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-testes
          path: ${{ steps.locate.outputs.dir }}/app/build/reports/tests/
          if-no-files-found: ignore
